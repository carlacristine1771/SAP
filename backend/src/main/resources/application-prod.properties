# ===============================
# PRODUÇÃO
# Supabase / PostgreSQL
# As credenciais serão configuradas
# como variáveis de ambiente no Render.
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Origens do frontend com acesso à API, exatas e separadas por vírgula
# (ex.: https://<projeto>.vercel.app). Obrigatória: sem ela a aplicação não inicia.
sap.cors.allowed-origins=${SAP_CORS_ALLOWED_ORIGINS}

# Criação do administrador inicial: desabilitada. Para habilitar uma única vez,
# defina SAP_BOOTSTRAP_ADMIN_ENABLED=true com _EMAIL, _USUARIO e _SENHA (12+ caracteres).
sap.bootstrap-admin.enabled=${SAP_BOOTSTRAP_ADMIN_ENABLED:false}

# Chave de criptografia das mensagens do chat. Obrigatória, sem valor padrão:
# ausente, vazia ou igual à chave padrão pública impede a inicialização. Mantenha
# o mesmo valor entre deploys; trocá-la torna ilegíveis as mensagens já gravadas.
sap.chat.secret=${SAP_CHAT_SECRET}

server.port=${PORT:8080}
