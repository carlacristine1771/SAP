# ===============================
# BANCO DE DADOS LOCAL - MYSQL
# ===============================
# No IntelliJ, crie a conexão como MySQL:
# Host: localhost | Porta: 3306 | Database: sap | User: root | Password: sua_senha
#
# Se o seu MySQL NÃO tiver senha, deixe DB_PASSWORD vazio ou use:
# spring.datasource.password=

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sap?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT
# Precisa ter pelo menos 32 caracteres por causa do algoritmo HS256.
# ===============================
jwt.secret=${JWT_SECRET:sap_secret_key_2026_local_dev_32_chars_minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
