# ===============================
# BANCO DE DADOS - SUPABASE / POSTGRESQL
# ===============================
# Configure as variaveis de ambiente localmente:
# DB_URL=jdbc:postgresql://<host>:<porta>/<database>?sslmode=require
# DB_USERNAME=<usuario>
# DB_PASSWORD=<senha>

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT
# Precisa ter pelo menos 32 caracteres por causa do algoritmo HS256.
# ===============================
jwt.secret=${JWT_SECRET:sap_secret_key_2026_local_dev_32_chars_minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
